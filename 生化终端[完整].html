<div style="width: 80%; margin: 20px auto;">
  <details class="thinking-description" style="
    background: #0a0a0a;
    border: 1px solid #2a2a35;
    border-top: 2px solid #ef4444;
    border-bottom: 2px solid #991b1b;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 60px rgba(0,0,0,0.5), 0 0 15px rgba(239,68,68,0.15);
    overflow: hidden;
    will-change: height;
    transition:
      height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
      box-shadow 0.25s ease;
  ">
    <summary style="
      padding: 12px 16px;
      color: #ef4444;
      cursor: pointer;
      list-style: none;
      transition:
        background 0.15s ease,
        border-radius 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 700;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(239,68,68,0.6), 0 0 20px rgba(239,68,68,0.3);
      position: relative;
      background: linear-gradient(to right, #111116, #18181f, #111116);
      overflow: hidden;
    ">☣ 生化终端 - <small><span class="thinking-summary" data-close="▶ 展开感染记录" data-open="▼ 隐藏感染记录" style="color: #71717a; letter-spacing: 1px;"></span></small>
      <span class="scanline-bar" style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 255, 65, 0.03) 2px,
          rgba(0, 255, 65, 0.03) 4px
        );
        pointer-events: none;
      "></span>
    </summary>
    <div style="
      max-height: 300px;
      overflow-y: auto;
      padding: 12px 16px;
      color: #71717a;
      line-height: 1.6;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      transition:
        opacity 0.2s ease,
        transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateY(-8px);
      opacity: 0;
      white-space: pre-wrap;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent);
    ">
    $2
    </div>
  </details>
  <style>
    /* 滚动条 - 匹配末世终端风格 */
    .thinking-description::-webkit-scrollbar {
      width: 4px;
    }
    .thinking-description::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    .thinking-description::-webkit-scrollbar-thumb {
      background: #991b1b;
      border-radius: 2px;
    }
    .thinking-description::-webkit-scrollbar-thumb:hover {
      background: #ef4444;
    }

    /* 展开状态 */
    .thinking-description[open] {
      box-shadow: 0 4px 16px rgba(0,0,0,0.24), 0 0 20px rgba(239,68,68,0.2) !important;
    }
    .thinking-description[open] > div {
      transform: translateY(0) !important;
      opacity: 1 !important;
      color: #d4d4d8 !important;
    }
    .thinking-description[open] > summary {
      background: linear-gradient(to right, #111116, #18181f, #111116) !important;
      text-shadow: 0 0 8px rgba(34,197,94,0.6), 0 0 20px rgba(34,197,94,0.3) !important;
      color: #22c55e !important;
    }

    /* 交互状态 */
    .thinking-description summary:hover {
      background: linear-gradient(to right, #141418, #1e1e28, #141418) !important;
    }
    .thinking-description[open] summary {
      border-radius: 10px 10px 0 0 !important;
    }
    .thinking-description summary::marker {
      display: none;
    }

    /* 文字改变效果 */
    .thinking-description[open] summary .thinking-summary::after {
      content: attr(data-open);
    }
    .thinking-description:not([open]) summary .thinking-summary::after {
      content: attr(data-close);
    }
    .thinking-description[open] summary .thinking-summary {
      color: #22c55e !important;
    }
  </style>
</div>
