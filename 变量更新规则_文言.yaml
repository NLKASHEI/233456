变量更新规则:

  世界阶段:
    - 据time_weather自判：八月廿四午前=秩序(世序如常)→八月廿四午至廿六午=爆发(全面崩溃)→八月廿六午后=末世(格局定)
    - 【必】抵分界即更勿延；转时同调camp/threat_level/世界事件/各大洲

  衍生状态:
    - physical_status每显露当前生理综况；mental_status每显露当前心绪综况
    - bmi据久饱波调；reputation据大行决调
    - nationality【必】创角定勿改，{{user}}处海或未定国→其他
    - camp爆发前填国籍，爆发后填营名或"流浪"，转换即替，入离换必更

  SPECIAL:
    _常: 0=成人均，NPC八成-1~1，精锐一二项3~5，BOSS可7+，队友同非超人，诸果截-10~10
    _联: 【必】E变→同更hp_max=stamina_max=100+E×5(截50~150)；L变→同更morale_max=100+L×5(截50~150)；凡SPECIAL变联字必同JSONPatch
    _创: 据背景/貌再叠算，貌→C修(绝丑-7~-10…绝二+7~10截)，禁全零，必同算hp_max/stamina_max/morale_max
    _长: 鲜变，久力微增+0.1，愈高愈缓
    S/P/E/C/I/A/L: number -10~10，定者按设，E/L变必联

  特质:
    - 直涉SPECIAL修值，正予正修负予负修；【必】创角定戏鲜变；新以insert添

  技能:
    - 练可精+1或+2；新技insert level自1始；技不逾五逾则叠旧
    - 【必】正特质→解一二关技(述强级高)或升旧技；负特质→现剧中影态；每特质必应技栏
    - 【必】创角据职赋心技(level 2~4始)；后天新技自1始，与初技区

  物品:
    - 获/耗/弃更，量零remove；【必】似物合一条禁复
    - detail式:"emoji ×N 品/态"；品(普通人可轻易获取的即为普通，难度决定品质)：普通/精良/稀有/史诗/传说；weight单重kg，不叠物量恒1
    - 【必】category确归：食物与水(罐/干粮/净水/肉干/酒)；医疗药品(绷带/抗生/止痛/消酒/术械)；建筑材料(木/钢/水泥/砖石/管道)；武器弹药(枪/弹/手雷/刀刃)；燃料能源(汽/柴/电池/丙烷/木炭)；工具零件(工具箱/扳手/绳/胶带/引擎件)；护甲衣物(防弹背心/盔/防化服/靴)；不入上七者→其他杂物
    - 【必】开局首复insert初资≥5件(食水≥3/医药≥1/工具≥1)，营仓储同
    - 【必·量限】×N禁批式(×100/500/1000/10000)；初限：食≤30/药≤20/弹≤50(唯弹矢)/工具≤10/甲≤5/燃料≤10；后可渐积唯不逾三倍
    - 【必·景搜对照】每insert前逐核category，错/null/空/敷写"其他杂物"皆重写：
        农场/农田/果园/菜地/温室/粮仓→食水+工具；医院/诊所/药房/救护站/防疫站→医药
        工地/仓库/厂房/矿区/沙场→建材；警局/军营/哨所/靶场/民兵据→武弹
        加油站/电厂/变电站/油库/太阳站→燃料；车间/修理铺/五金店/工具房→工具
        民宅/公寓/宿舍/服装店/商场/超市→护甲+杂物；河湖/海岸/钓鱼点→食水
        森林/山地/荒野采→食水+医药；宁缺毋滥

  环境:
    - location景切更；time_weather每推时映天；temperature随天/地变
    - radiation 0~100，≥20黄警≥50赤危；threat_level综危评；noise映周动
    - comfort 0~100，0~20恶/21~40劣/41~60常/61~80佳/81~100适
    - hatred 0~100，末世启秩序/爆发不启：0~30安/31~50窥/51~70标/71~90猎/91~100罚
        留据逾48h+10/24h无战+5/每24h-2/主探或战清零/种田不积

  载具:
    - 【必】type确归：民用汽车(轿/SUV/皮卡/面包车)；商用车辆(货车/巴士)；二轮载具(摩托车/自行车)；重装载具(装甲车/坦克/推土机)；水上载具(快艇/帆船/橡皮艇)；航空载具(直升机/飞机/无人机)；不入上六者→其他
    - 余油示程0-1000km勿离谱；驶耗油，<30%警；无则空对
    - appearance【必】详述：色/型征/改痕/锈损/涂标，禁"一辆车"
    - condition 0~20废/21~40重损/41~60耗/61~80良/81~100新；≤40抛锚险≤20随彻毁
    - 战/撞/劣路减，修可复

  建筑:
    - 得/失/损/修更；status联condition：81~100完/61~80微/41~60中/21~40重/0~20毁，≤40功限
    - 【必】初得定所必insert，流浪空对；desc≥30字，defense/facilities无则写"无XX"
    - storage式同物品与背包通勿重；【容】限3勿复同名

  队友:
    _式: appearance≥80字(发/容/体/着/佩，禁抽象)；equipment≥40字(逐列型/色/态)；thoughts≥30字(一人独白禁旁白)；detail≥30字(综态快照禁上评)；SPECIAL定按设未定正态
    - 【必·每更】检NPC好感≥75→remove NPC insert队友勿遗；favor承relation，mp=100+L×5，abilities取NPC.detail
    - status随剧更，伤/病/绪同修；abilities≥50字举能表应SPECIAL；离/亡remove
    - 【容】限5逾存favor最高

  NPC:
    _式: 同队友；detail≥40字(位/姿/为事/身神/关系)；在互者必录染者征指
    - 【必】relation≥75即转；title一言括具画感；【容】限10逾存relation最高；禁同景复

  世界事件:
    - 每更呈3件(主未知)伏联；遵时世界观禁OOC复述；【容】3逾删最旧
    - 玩家世范实影必体现；普通模下更尸潮向规

  各大洲:
    - 【必】每更禁千篇一律；据局凸各洲况；述须具体映时递；玩家在洲动须映

  公共通讯:
    - 主官方电台；【必】每更推剧，与时对齐勿越；无收音备则无收须剧提；【容】3逾删旧

  私人通讯:
    - 【必】每更唯记对讯禁{{user}}复；发者须建档NPC契设；陌NPC勿直发须建联剧垫
    - 联前：①交频/号(NPC.detail现)②同营网③公频呼建④主告；四一即可
    - 狂病模可现染者假讯；无备/信号→"无信号"；【容】3

  核心状态:
    - hp_current 0~150伤减治复勿逾max；hp_max=100+E×5(50~150)根变调
    - stamina_current 0~150动耗休复竭限；stamina_max=100+E×5(50~150)根变调，超重罚幅受E影
    - hunger_current 0~100时衰食复，尽始扣hp；hunger_max 1~100根变调，E影复速
    - thirst_current 0~100较饥速衰饮复，尽扣hp先于饥；thirst_max 1~100根变调
    - morale_current 0~150遭±(3~8)友亡/叛大减安休/社交升；morale_max=100+L×5(50~150)根变调
    - infection_current 0~100触染增药抑疫除，≥60危亮剧应，E影抵力；infection_max常100勿频调

  感染者行为模式: enum[普通型,狂病型]，建档择勿改
  NPC行为模式: enum[正常型,全员恶人型]，建档择勿改

  营地:
    - 营为久势根地异庇护，必更；人数勿唯一据文推；流浪态子可空/名="流浪"
    - 【必·初化】初建11子缺一不可：①名②人数③运作④防御⑤士气⑥资源(7池全填初可0)⑦物资(≥3食水如罐/瓶水/压缩饼)⑧领袖⑨成员(≥3，领袖+≥2骨干)⑩建筑(2~4座类匹景名中文)⑪动态(≥1条"HH:MM 营建")。⑦⑩⑪最常遗格注
    - 营物资式与物品/庇护storage/小农场storage全同({detail,weight,category})，物可四者互转；禁自创式
    - 营物资不限件然合物理(一皮卡不装整仓)
    - 【必·饥罚】物资食水类总=0时士日-8~15；续2日无食士-20；续3日可叛/暴
    - 【必·食减】员日耗1.5~2.5kg食，hunger每12h-8~15，乏水thirst每6h-10~15；AI每推时自扣营资食水类，乏则加速减
    - 士变须应剧：胜/获给+5~10/伤亡断粮-5~15/日波±1~3；人变须剧撑禁跃增；运作/防御每更必实变禁复贴

    营_成员:
      - 【必·每更】有营必更(人变/角调/态变至少一)；初≥3人(领袖1+骨干≥2)名中文
      - 【必】领袖必同录员(角=领袖)勿仅/领袖存；优从旧NPC摘(好感≥50或剧归)insert员时NPC存不删
      - 入/离/亡/叛同replace/insert/remove限20；角随剧调detail写技/责

    营_建筑:
      - 【必】初2~4座类匹景；无量限可新/升/拆；级1~5新=1
      - 升耗资组(建材+工具为基随级类搭他池)；每级condition+20效升
      - 效写实增益(如"容10人居/士气+2/日")；condition≤30效半
      - 战/天灾-10~-30修+20~+40；desc≥15字

    营_资源:
      - 【必·硬限】食水≤500/医药≤300/建材≤500/武弹≤400/燃料≤300/工具≤300/护甲≤300；出前逐池校逾截
      - 【必·初节】开局初建：食水≤200/医药≤100/建材≤200/武弹≤150/燃料≤100/工具≤100/护甲≤80；此存者随携勿铺张
      - 拆式:资增=weight×品系(普×1.0/良×1.5/稀×2.5/史×4.0/传×6.0)，入物category应池，杂物勿拆
      - 建耗:新建1级耗建材50~80+工具20~30；升耗视类组池
      - 修耗:condition每复1点耗建材0.5~1.0
      - 【必】建/升/修必delta应资子字，资欠败；归零存0勿负；末世中后可渐积破初限勿逾硬限

    营_动态:
      - 【必】有事追1~3条式"HH:MM 容"，存5逾删旧；盖员变/建升/资增减/防战/士波/外访
      - 【必·任联】任完/败/断记果要；战记伤亡资损/建修记耗完况/搜记获概/医记疗象药耗
      - 【必·生事】日食耗/饮耗(无储水记"饮水告急")/员病伤康/新入旧离皆记
      - 【必·外事】染袭/匪扰/商访/极天发必记

  任务队列:
    - 【必】无营不补，有营则补
    - 【必】AI据局自生；唯计待执+进行中限3，已成/败/断不计；每更尽生2~3异任勿仅1；避同3同型
    - 生时:①营资缺/防弱/施升②建cond≤40或建设中③剧确建/搜/制/修图④阶转重估⑤新NPC/友⑥得新材/具
    - 玩家确执→待执replace进行中；执者写具名/"主角"/"3名幸存者"等禁糊
    - 需资列具单位(如"建材×40,工具×20")无需写"无需额外"
    - 进度推:①时流②玩家投行③投资量④执者力(SPECIAL高者速)
    - ≥100判:默成；唯确败因(伤亡/资欠/袭断/施毁)判败
    - 成→写得物/效述同更应字(搜→营资或背包insert/建→cond+20~40desc更/制→物栏insert/修→cond复+20~40)，搜制产物insert必写category
    - 败→写具因禁"不明"/"未知错误"；建修类标须指存建/载名禁指不存
    - 【必】禁remove整队重insert；删单remove /任务队列/{n}/替队replace /任务队列/追insert /任务队列/-
    - 成/败/断留1轮remove单索腾容；剧中可断(执伤/营袭)进度存改中断
