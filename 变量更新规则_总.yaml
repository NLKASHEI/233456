变量更新规则:
  世界阶段:
    type: enum[秩序期, 爆发期, 末世期]
    check:
      - 根据环境.time_weather中的时间自动判断并更新阶段
      - 秩序期：8月24日12:00之前，社会秩序正常，偶发异常事件
      - 爆发期：8月24日12:00至8月26日12:00，全面崩溃，秩序瓦解中
      - 末世期：8月26日12:00之后，末世格局定型，新秩序建立中
      - 【强制】时间推进到阶段分界点时必须立即replace更新，不得延迟
      - 【强制】阶段转换时必须同步调整：camp字段（国籍→营地/流浪）、环境威胁等级、世界事件和各大洲的描述基调

  衍生状态:
    physical_status:
      type: string
      check: 每次更新需反映当前生理状态综合描述
    mental_status:
      type: string
      check: 每次更新需反映当前心理状态综合描述
    bmi:
      type: enum[过瘦, 较瘦, 标准, 较胖, 过胖]
      check: 根据长期饱食度波动调整
    reputation:
      type: enum[遗臭万年, 劣迹斑斑, 默默无闻, 声誉鹊起, 青史留名]
      check: 根据重大行为和决策调整
    nationality:
      type: enum[华国, 美利坚国, 法国, 大毛国, 日本国, 巴西国,其他]
      check:
        -[强制！重要！]必须根据角色开局创建更新！！
        - 角色创建时确定，游戏中除主动前往以外，禁止更改
        - 影响出生点和初始环境
        - 当{{user}}处于海上或者其他未定义的国家时，切换为其他
    camp:
      type: string
      check:
        - 大爆发前填写国籍（如"华国""美利坚""日本"），根据角色背景设定确定
        - 大爆发后：若角色有营地/据点/势力归属则填写归属名称，无归属则填"流浪"
        - 【强制】大爆发前→后的转换时点，国籍自动替换为营地归属或"流浪"
        - 加入/离开/更换营地时必须更新
变量更新规则:
  SPECIAL:
    _正态分布:
      - 0为普通成人平均，NPC 80%在-1~1，精锐1~2项3~5，BOSS级可出现7+
      - 队友同理，不会全是超人
      - 任何结果clamp到-10~10
    _联动:
      - 【强制】E变化→同步replace hp_max、stamina_max：= 100 + E×5（上限150/下限50）
      - 【强制】L变化→同步replace morale_max：= 100 + L×5（上限150/下限50）
      - 特质变化→检查SPECIAL修正，同步调整
      - 【强制】任何SPECIAL变化，联动字段必须在同一JSONPatch中一起更新
    _开局:
      - 角色创建时根据职业/特质/背景/外貌叠加计算初始值，禁止全为0
      - 外貌→C修正：绝世丑陋-7~-10 … 绝世无二+7~10，修正叠加后clamp
      - 初始化后必须同步计算并replace hp_max、stamina_max、morale_max
      - 特质→开局技能：正面解锁或+level，负面移除或-level
      - 有载具/初始物品必须在首次回复insert
    _成长:
      - SPECIAL极少变动，仅长期努力可微量增长(+0.1)
      - 属性越高成长越慢
    S: { type: number, range: -10~10, check: 已定义NPC按设定值，无变化不更新 }
    P: { type: number, range: -10~10, check: 同上 }
    E: { type: number, range: -10~10, check: 同上，E变化必须同步联动 }
    C: { type: number, range: -10~10, check: 同上 }
    I: { type: number, range: -10~10, check: 同上 }
    A: { type: number, range: -10~10, check: 同上 }
    L: { type: number, range: -10~10, check: 同上，L变化必须同步联动 }

  特质:
    type: |-
      { 正面: string[], 负面: string[], 自定义: string[] }
    check:
      - 【重要】特质直接影响SPECIAL属性的修正值
      - 正面特质提供正面修正，负面特质提供负面修正
      - 【强制】角色创建时确定，并主动加入，游戏中极少变动
      - 新增特质用insert添加
变量更新规则:
  技能:
    type: |-
      { [技能名: string]: { level: number(1~10); desc: string } }
    check:
      - 通过练习或经历可精进level，每次+1或+2
      - 新技能用insert添加，level从1开始
      - 角色职业/身份必须转化为对应技能
      - 技能不得超过五个，若超过，则试图改变已有的，进行叠加。
      - _特质对技能的强制影响（开局必须执行）：
          【强制】正面特质→必须解锁1~2个相关技能，描述越强等级越高，或提升已有职业技能level
          【强制】负面特质→必须体现在剧情中，影响状态
          自定义特质→根据描述内容决定增减
          每个特质都必须在技能栏中有对应体现
      - _初始技能赋予规则：
          角色创建时，必须根据职业自动赋予对应核心技能（level从2~4起步，视职业专业程度）
          然后根据特质额外增补或调整
          【强制】后天新技能从level 1开始，与初始职业技能区分

  物品:
    type: |-
      { [物品名: string]: { detail: string; weight: number; category: enum[食物与水, 医疗药品, 建筑材料, 武器弹药, 燃料能源, 工具零件, 护甲衣物, 其他杂物] } }
    check:
      - 获取/消耗/丢弃时更新，数量为0用remove
      - 【强制】不可添加多个相似物品，应合并为同一条目
      - 【强制】detail格式："emoji ×N 品质/状态"，emoji须准确反映物品类型
      - 【强制】品质关键词：普通/精良/稀有/史诗/传说
      - 【强制】weight为单件重量kg，不可堆叠物品数量始终为1
      - 【强制】category须按物品性质正确归类：食物与水(罐头/干粮/净水/肉干/酒)、医疗药品(绷带/抗生素/止痛药/消毒酒精/手术器械)、建筑材料(木材/钢材/水泥/砖石/管道)、武器弹药(枪械/子弹/手雷/刀刃)、燃料能源(汽油/柴油/电池/丙烷/木炭)、工具零件(工具箱/扳手/绳索/胶带/引擎零件)、护甲衣物(防弹背心/头盔/防化服/靴子)、其他杂物(无法归入以上七类者)
      - 【强制】开局/角色创建首次回复必须insert初始物资：食物与水≥3种、医疗药品≥1种、工具零件≥1种，总量≥5件。detail须写emoji+数量+品质，category必须正确归类。营地/建筑仓储同理须有初始储备。
      - 【强制·数量上限】detail中×N数量严禁批发式数字(×100/×500/×1000/×10000等)。初始单种物品数量上限：食物类≤30、医疗药品类≤20、武器弹药类≤50(仅子弹/箭矢可)、工具零件类≤10、护甲衣物类≤5、燃料能源类≤10。后期可通过生产/贸易逐步积累，但单种仍不得超过上述上限的3倍
      - 【强制·一票否决】场景搜刮获得物必须insert且category必填！以下场景→category对照表每次insert前逐条核对，category错误/null/留空/写"其他杂物"敷衍者一律重写：
          农场/农田/果园/菜地/温室/粮仓 → 食物与水、工具零件
          医院/诊所/药房/救护站/防疫站 → 医疗药品
          工地/仓库/厂房/矿区/沙场 → 建筑材料
          警局/军营/哨所/靶场/民兵据点 → 武器弹药
          加油站/电厂/变电站/油库/太阳能站 → 燃料能源
          车间/修理铺/五金店/工具房 → 工具零件
          民宅/公寓/宿舍/服装店/商场/超市 → 护甲衣物、其他杂物
          河湖/海岸/钓鱼点 → 食物与水
          森林/山地/荒野采集 → 食物与水、医疗药品
          任何场景搜刮所得物品均须遵守此表，宁缺毋滥。
变量更新规则:
  环境:
    location:
      type: string
      check: 场景切换时必须更新
    time_weather:
      type: string
      check: 每次更新推进时间，反映当前时间段和天气变化
    temperature:
      type: string
      check: 随天气/地点变化更新
    radiation:
      type: number
      range: 0~100
      check: ≥20黄色警告，≥50红色危险
    threat_level:
      type: string
      check: 综合环境危险评估
    noise:
      type: string
      check: 反映周围动静
    comfort:
      type: number
      range: 0~100
      check: 0~20恶劣/21~40较差/41~60一般/61~80较好/81~100舒适
    hatred:
      type: number
      range: 0~100
      check:
        - 末世期启用更新，秩序期、爆发期不启用
        - 0~30安全/31~50窥伺/51~70标记/71~90猎杀/91~100天罚
        - 据点停留超48h+10，24h无战斗+5
        - 每24h自然衰减-2
        - 当主动探索或是战斗时，清零
        - 主动建设庇护所等“种田”不是安逸行为，短时不积累威胁值

  载具:
    type: |-
      { [载具名: string]: { type: string; name: string; appearance: string; condition: number(0~100); status: string; fuel: number(0~100); mileage: string } }
    check:
      - 剩余燃油显示剩余里程，不要过于离谱，结合现实，一般载具在0-1000km浮动
      - 行驶消耗燃油，燃油<30%警告
      - 无载具时此字段为空对象
      - 【强制】appearance必须详细描述载具外观：颜色、型号特征、改装痕迹、锈蚀/破损部位、涂装标志等，不能只写"一辆车"
      - condition为载具完整度：0~20报废/21~40严重损坏/41~60损耗/61~80良好/81~100崭新
      - 【重要】condition≤40有抛锚风险，≤20随时可能彻底损坏
      - 战斗/碰撞/恶劣路况会降低condition，维修可恢复
变量更新规则:
 建筑:
    type: |-
      { [庇护所名: string]: { status: enum[完好, 轻微损坏, 中度损坏, 严重损坏, 损毁, 建设中]; condition: number(0~100); desc: string(≥30字 外观/结构/破损/居住); storage: { [物品名: string]: { detail: string; weight: number; category: enum[食物与水, 医疗药品, 建筑材料, 武器弹药, 燃料能源, 工具零件, 护甲衣物, 其他杂物] } }; defense: string; facilities: string } }
    check:
      - 获得/失去/受损/维修时更新
      - 【强制】status与condition联动：81~100完好，61~80轻微，41~60中度，21~40严重，0~20损毁，condition≤40功能受限
      - 【强制】首次获得固定住所必须insert，流浪状态为空对象
      - 【强制】desc≥30字，defense无则写"无防御设施"，facilities无则写"无可用设施"
      - 【强制】storage格式同物品，与背包物品互通但不可重复出现
      - 【容量】上限3个，不可重复添加同名/相似庇护所

  队友:
    type: |-
      { [队友名: string]: { gender, age, status, appearance(≥80字), equipment(≥40字), SPECIAL, hp(0~150), mp(0~150), favor(0~100), abilities(≥50字), thoughts(≥30字), detail(≥30字) } }
    _人物格式规范:
      - appearance≥80字：发型发色、面容特征、身材体型、穿着细节（款式/颜色/材质/磨损）、随身配饰，禁止抽象形容词
      - equipment≥40字：逐项列出型号/颜色/状态/细节
      - thoughts≥30字：第一人称真实内心独白，禁止第三人称旁白
      - detail≥30字：当前综合状态快照，禁止上帝视角评语
      - SPECIAL：已定义按设定值，未定义按正态分布
    check:
      - 【强制·每次更新】检查所有NPC好感度，≥75者须转入队友(remove NPC→insert队友)，不得遗漏
      - NPC转队友：favor继承relation，mp=100+L×5，abilities取自NPC.detail
      - status随剧情实时更新，受伤/生病/情绪波动时同步修正
      - abilities≥50字，须举例说明能力表现，与SPECIAL对应
      - 离开/死亡remove
      - 【容量】上限5个，超出保留favor最高

  NPC:
    type: |-
      { [NPC名: string]: { gender, age, title, appearance(≥80字), equipment(≥40字), SPECIAL, relation, hp(0~150), thoughts(≥30字), detail(≥40字) } }
    check:
      - _人物格式规范同队友；detail≥40字，含当前位置与姿态/正在做的事/身体精神状态/关系倾向
      - 在场互动过的人物必须录入，感染者可用特征指代
      - 【强制】relation≥75立即转队友
      - title一句话概括第一印象，有画面感
      - 【容量】上限10个，超出保留relation最高
      - 禁止同场景重复录入

  世界事件:
    type: |-
      { [事件ID: string]: { type: string; title: string; location: string; desc: string } }
    check:
      - 每次更新需呈现3个事件（主要是{{user}}未知的事件），事件间需有伏笔关联
      - 【强制】事件应遵循对应时间世界观，禁止世界层面OOC与重复描述，要有对应逻辑和后续。
      - 【容量】同时最多保留3个世界事件，超过则移除最旧/已完结的
      - 【玩家影响】玩家行动若产生世界范围的实质影响，必须作为世界事件体现
      -  若为普通模式下，需要更新描述尸潮的动向和规模

  各大洲:
    type: |-
      { asia: string; europe: string; africa: string; namerica: string; samerica: string; oceania: string }
    check:
      - 【强制】每次更新，禁止描述千篇一律
      - 【强制】描述根据当前局势突出各州情况
      - 【强制】各洲动态每次更新必须有实质性变化，描述需具体，体现时间递进
      - 【玩家影响】玩家所在洲的动向描述必须体现玩家导致的大规模行动产生的影响

  公共通讯:
    type: |-
      { [消息ID: string]: { sender: string; time: string; content: string } }
    check:
      - 主要是官方来源的公共电台
      -【强制】注意与相应时期相应世界观对齐，不要越界！
      - 反映外部局势广播：情报、求救、警告
      - 内容随剧情时局变化，玩家若无收音设备则无法接收，需在剧情中提及
      - 听觉与传闻: 描述短波电台里偶尔传来的并非纯粹的求救，而是还有绝望录音
      - 【强制】每次必须更新！保证沉浸感！借助公共通讯去推进剧情！
      - 【容量】同时最多保留3条，超过则移除最旧消息
     

 私人通讯:
  type: |-
    { [联系人名: string]: Array<{ sender: string; time: string; content: string }> }
  check:
    - 【强制】与相应时期对应，不得越界更新！不得出现不符合当前时期的内容。
    - 【强制】每次必须更新，仅记录对方发来的消息，禁止{{user}}回复
    - 【强制】发送者须为已建档NPC，消息内容契合其人设与当前处境
    - 【强制】联络前提：NPC须已通过剧情获得主角通讯方式——①曾与主角交换过频率/号码（须在NPC的detail或剧情中体现）②与主角同属一个营地通讯网③通过公共频道呼叫后建立联系④主角主动告知
    - 【强制】陌生NPC不得直接发送私人消息，首次联络须有建立联系的剧情铺垫
    - 消息类型多样化：求救/联络/交易/宣言/试炼
    - 狂病模式下可出现感染者假扮消息
    - 无通讯设备或信号时显示”无信号”
    - 【容量】上限3条
变量更新规则:
  核心状态:
    hp_current:
      type: number
      range: 0~150
      check:
        - 受伤时减少，治疗/休息时恢复
        - 【强制】不得超过hp_max
    hp_max:
      type: number
      range: 1~150
      check:
        - 仅在体质根本变化时调整
        - 【联动】公式 = 100 + SPECIAL.E × 5（E为0时100，E为10时150）
    stamina_current:
      type: number
      range: 0~150
      check:
        - 长时间运动/战斗消耗，运动也会消耗
        - 体力在不行动时可以自然恢复，体质较好的恢复较快
        - 体力耗尽时行动受限，体现在剧情中
    stamina_max:
      type: number
      range: 1~150
      check:
        - 仅在体质根本变化时调整
        - 【联动】公式 = 100 + SPECIAL.E × 5
        - 超重状态下的体力惩罚幅度受E影响
    hunger_current:
      type: number
      range: 0~100
      check:
        - 随时间缓慢衰减，进食恢复
        - 【强制】归零后开始扣除hp
    hunger_max:
      type: number
      range: 1~100
      check:
        - 仅在体质根本变化时调整
        - 【联动】SPECIAL.E影响自然恢复速度
    thirst_current:
      type: number
      range: 0~100
      check:
        - 比饱食度更快衰减，饮水恢复
        - 【强制】归零后扣除hp，优先于饥饿
    thirst_max:
      type: number
      range: 1~100
      check:
        - 仅在体质根本变化时调整
    morale_current:
      type: number
      range: 0~150
      check:
        - 遭遇/互动调整±(3~8)
        - 队友死亡/背叛大幅降低，安全休息/社交提升
    morale_max:
      type: number
      range: 1~150
      check:
        - 仅在精神韧性根本变化时调整
        - 【联动】公式 = 100 + SPECIAL.L × 5（L为0时100，L为10时150）
    infection_current:
      type: number
      range: 0~100
      check:
        - 接触感染源增加，药物抑制，疫苗消除
        - 【重要】≥60触发危险高亮，剧情必须呼应
        - 【联动】SPECIAL.E影响抵抗力
    infection_max:
      type: number
      range: 1~100
      check:
        - 通常固定100，无需频繁调整
变量更新规则:
  感染者行为模式:
    type: enum[普通型, 狂病型]
    check:
      - 模式由玩家在建档时选择，游戏中不可更改

  NPC行为模式:
    type: enum[正常型, 全员恶人型]
    check:
      - 模式由玩家在建档时选择，游戏中不可更改

  营地:
    type: |-
      { 名称: string; 人数: number; 运作情况: string; 防御状态: string; 士气: number(0~100); 资源: { 食物与水: number; 医疗药品: number; 建筑材料: number; 武器弹药: number; 燃料能源: number; 工具零件: number; 护甲衣物: number }; 物资: { [物品名: string]: { detail: string; weight: number; category: enum[食物与水, 医疗药品, 建筑材料, 武器弹药, 燃料能源, 工具零件, 护甲衣物, 其他杂物] } }; 领袖: string; 成员: { [成员名: string]: { 角色: enum[领袖, 骨干, 普通成员, 工匠, 守卫, 医生, 农夫, 侦察兵, 交易员, 其他]; 状态: string; detail: string } }; 建筑: { [建筑名: string]: { 类型: enum[居住, 防御, 生产, 仓储, 医疗, 训练, 研究, 其他]; 等级: number(1~5); 效果: string; condition: number(0~100); status: enum[完好, 轻微损坏, 中度损坏, 严重损坏, 损毁, 建设中]; desc: string } }; 近期动态: string[] }
    check:
      - 营地与庇护所不同，是玩家长期的势力根据地，必须更新
      - 营地人数不可能只有一个，请酌情更新，根据正文推测人数
      - 流浪状态下此字段所有子项可留空或仅保留名称="流浪"，有固定营地时必须填充
      - 【强制·营地初始化】首次创建营地时，以下9个子字段缺一不可，漏任意一个即为不合格输出：①名称 ②人数 ③运作情况 ④防御状态 ⑤士气 ⑥资源(7池全填，初始可为0) ⑦物资(≥3类食物与水物资，如罐头/瓶装水/压缩饼干，开局必填) ⑧领袖 ⑨成员(≥3人，领袖+≥2骨干) ⑩建筑(初始2~4座，类型与场景匹配，名称中文) ⑪近期动态(≥1条，如"HH:MM 营地建立")。其中⑦⑩⑪是最常被遗漏的，须格外注意
      - 【强制】营地物资格式与物品字段、庇护所storage字段完全一致（{detail, weight, category}），禁止自创格式
      - 【强制】营地物资与背包、庇护所storage、小农场storage为同一套物资格式，物品可在四者间互相转移
      - 【强制】营地物资不限制件数，但需符合物理逻辑（一辆皮卡不可能装下整座仓库）
      - 【强制·饥饿惩罚】营地无食物(物资中食物与水类总量=0)时，士气每日-8~15；连续2日无食士气-20；连续3日无食营地可能发生叛逃/暴动
      - 【强制·食物递减】营地成员每人每日消耗约1.5~2.5kg食物，hunger_current每12h-8~15，缺乏饮用水时thirst_current每6h-10~15。AI应在每次时间推进时自动从营地物资食物与水类扣减对应重量，不足时hunger_current加速递减
      - 士气变化需与剧情呼应：胜利/获得补给+5~10，伤亡/断粮-5~15，日常波动±1~3
      - 人数变更需有剧情支撑，禁止跳跃式增长
      - 运作情况、防御状态每次更新必须有实质性变化，禁止复制粘贴
    _成员:
      check:
        - 【强制·每次更新】有营地必须更新成员，不得跳过（人数变动/角色调整/状态变化至少一项）
        - 【强制】初始≥3人(领袖1+骨干≥2)，姓名中文实名
        - 【强制】领袖必须同时作为成员录入（角色=领袖），不可仅在/领袖字段存在而/成员中缺失
        - 【强制·优先NPC】优先从已有NPC摘录(好感≥50或剧情归属)，insert成员时NPC记录保留不删，二者共存
        - 加入/离开/死亡/叛逃须同步replace/insert/remove，上限20
        - 【强制】角色随剧情调整(晋升/降职/专精)，detail写明技能/职责
    _建筑:
      check:
        - 【强制】初始2~4座，类型与场景匹配；无数量上限，可新建/升级/拆除
        - 等级1~5，新建=1级；升级消耗资源组合（建材+工具为基础，随等级和类型搭配其他池）；每级condition+20效果提升
        - 效果写明实际增益(如"容纳10人居住/士气+2/日")；condition≤30效果减半
        - 战斗/天灾-10~-30，维修+20~+40；desc≥15字简述外观用途
    _资源:
      check:
        - 【强制·资源硬上限】各资源池绝对上限值：食物与水≤500、医疗药品≤300、建筑材料≤500、武器弹药≤400、燃料能源≤300、工具零件≤300、护甲衣物≤300。输出前逐池校验，任何池超出上限则强制clamp到最大值，不得通融
        - 【强制·初始节制】开局/首次创建营地时，各池初始值上限：食物与水≤200、医疗药品≤100、建筑材料≤200、武器弹药≤150、燃料能源≤100、工具零件≤100、护甲衣物≤80。这不是后期储备仓库，而是幸存者随身携带的初始物资量，必须克制
        - 【强制】物品拆解为资源公式：资源增量 = weight × 品质系数。品质系数：普通×1.0 / 精良×1.5 / 稀有×2.5 / 史诗×4.0 / 传说×6.0
        - 拆解后资源进入物品category对应的资源池（食物与水→食物与水池，医疗药品→医疗药品池，以此类推），其他杂物不可拆解
        - 建造消耗：新建建筑=等级1消耗建筑材料50~80+工具零件20~30；升级消耗视建筑类型组合多池（建材+工具为基础，随等级搭配武器弹药/医疗药品/燃料能源等）
        - 维修消耗：condition每恢复1点消耗建筑材料0.5~1.0资源，视建筑类型浮动
        - 【强制】建造/升级/维修时必须delta对应资源子字段（如/营地/资源/建筑材料），资源不足时操作失败
        - 资源值归零不删除，保留为0；不可为负
        - 后期(末世中期以后)资源可通过贸易/大规模搜刮/农业生产逐步积累突破初始上限，但不得超过硬上限
    _近期动态:
      check:
        - 【强制】有实质事件追加1~3条，格式"HH:MM 内容"，保留5条，超出的移除最旧条目
        - 内容涵盖：成员变动/建筑升级/物资增减/防御战斗/士气波动/外部访客
        - 【强制·任务联动】任务完成/失败/中断时必须在动态中记录结果摘要；战斗类任务→记录伤亡与资源损耗；建造维修类→记录资源消耗量与完成情况；搜索类→记录获得物概要；医疗类→记录治疗对象与药品消耗
        - 【强制·生活事件】每日食物消耗、饮水消耗（若营地无储水则记录"饮水告急"）、成员生病/受伤/康复、新成员加入/老成员离开，均须记录为动态
        - 【强制·外部事件】感染者袭击/匪徒骚扰/商队到访/极端天气，发生时必须记录动态

变量更新规则:
  任务队列:
    type: |-
      [{ 类型: string; 目标: string; 执行者: string; 预计耗时: string; 所需资源: string; 进度: number(0~100); 状态: enum[待执行, 进行中, 已完成, 失败, 中断]; 结果: string|null }]
    check:
      - 【强制】任务由AI根据当前局势自动生成，容量规则：仅计"待执行"+"进行中"，上限3个；已完成/失败/中断不计入容量
      - 【强制】每次更新应尽量生成2~3个不同任务供玩家选择，除非局势确实无需求；不要只生成1个
      - 【强制】任务类型应多样化，避免同时存在3个同类型任务
      - 【强制】生成时机①营地物资短缺/防御薄弱/设施需升级②建筑condition≤40需维修或存在"建设中"项目③正文剧情出现明确建设/搜索/制造/维修意图④阶段转换时重新评估⑤新增NPC/队友时可能有相关任务⑥玩家获得新材料/工具时可能有制造机会
      - 【强制】玩家在正文中明确开始执行某任务时（如"我去加固围墙""张三带人出发搜刮"），该任务状态须从"待执行"replace为"进行中"
      - 【强制】执行者须写明：具体NPC名、"主角"、或泛称如"3名幸存者""2人小队"，禁止写"某人""小队"等模糊表述
      - 【强制】所需资源须列出具体资源单位（如"建筑材料×40, 工具零件×20"），无需资源写"无需额外资源"，已投入的资源在进度推进时体现
      - 【强制】进度推进依据①正文时间流逝②玩家描述的投入行动③投入的资源量④执行者能力（SPECIAL相关属性高的推进更快）
      - 【强制】进度≥100时必须判定：默认成功；仅在有明确失败原因时判失败（执行者伤亡/资源严重不足/感染者袭击中断/设施被毁）
      - 【强制】成功后→结果写入获得物/效果描述，同步更新对应字段（搜索→营地物资或背包insert，建设→建筑.condition+20~40且desc更新，制造→物品栏insert，维修→对应condition恢复+20~40）。搜索/制造产生的新物品insert时必须写category字段
      - 【强制】失败后→结果写明具体原因，不写"不明原因"或"未知错误"
      - 【强制】建设/维修类任务的目标必须指向已存在的建筑名/载具名，禁止指向不存在的对象
      - 【强制】禁止remove整个/任务队列数组后重新insert。删除单个任务用remove /任务队列/{n}，替换整个队列用replace /任务队列，追加新任务用insert /任务队列/-
      - 已完成/失败/中断的任务保留1轮后remove单个索引，为后续任务腾出容量
      - 任务可被正文剧情中断（执行者受伤、营地被袭等），中断时进度保留、状态改为"中断"
